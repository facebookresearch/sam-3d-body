[project]
name = "sam-3d-body"
dynamic = ["version"]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]
keywords = ["human-mesh-reconstruction", "human-mesh-recovery", "sam-3d"]
description = "SAM 3D Body: Robust Full-Body Human Mesh Recovery"
requires-python = ">=3.10"
dependencies = [
    "appdirs>=1.4.4",
    "appnope>=0.1.4",
    "chump>=1.6.0",
    "cython>=3.2.2",
    "dill>=0.4.0",
    "einops>=0.8.1",
    "ffmpeg>=1.4",
    "fvcore>=0.1.5.post20221221",
    "huggingface-hub>=1.2.1",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "joblib>=1.5.2",
    "jsonlines>=4.0.0",
    "loguru>=0.7.3",
    "networkx==3.2.1",
    "opencv-python>=4.11.0.86",
    "optree>=0.18.0",
    "pandas>=2.3.3",
    "pycocotools>=2.0.10",
    "pyrender>=0.1.45",
    "pyrootutils>=1.0.4",
    "pytorch-lightning>=2.6.0",
    "roma>=1.5.4",
    "scikit-image>=0.25.2",
    "seaborn>=0.13.2",
    "timm>=1.0.22",
    "torch>=2.6.0",
    "webdataset>=1.0.2",
    "xtcocotools>=1.14.3",
    "yacs>=0.1.8",
    "moge==2.0.0",
    "detectron2",
]

[project.urls]
Homepage = "https://ai.meta.com/blog/sam-3d/"
Repository = "https://github.com/facebookresearch/sam-3d-body"

[project.optional-dependencies]
cpu = ["torch>=2.6.0"]
cu124 = ["torch>=2.6.0"]
cu126 = ["torch>=2.6.0"]
cu128 = ["torch>=2.6.0"]

[dependency-groups]
dev = [
    "hydra-submitit-launcher>=1.2.0",
    "pytest>=9.0.2",
    "rich>=14.2.0",
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
    "notebook>=7.5.0",
    "black>=25.12.0",
]

[tool.uv.extra-build-dependencies]
xtcocotools = ["numpy"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]
no-build-isolation-package = ['detectron2']

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
moge = { git = "https://github.com/microsoft/MoGe.git" }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "a1ce2f9" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sam_3d_body/__init__.py"

[tool.hatch.build]
packages = ["sam_3d_body"]
